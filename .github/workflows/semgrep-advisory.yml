name: Semgrep Advisory Review

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

  schedule:
    - cron: "17 3 * * 1"
      timezone: "America/New_York"

permissions:
  contents: read

jobs:
  semgrep-advisory:
    name: Advisory findings
    runs-on: ubuntu-latest

    steps:
      - name: Check out Redshift
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pinned Semgrep engine
        run: |
          python -m pip install --disable-pip-version-check semgrep==1.172.0
          semgrep --version

      - name: Fetch current upstream Semgrep rules
        shell: bash
        run: |
          git clone --depth 1 \
            https://github.com/semgrep/semgrep-rules.git \
            "$RUNNER_TEMP/semgrep-rules"

          cd "$RUNNER_TEMP/semgrep-rules"

          RULES_BRANCH="$(git branch --show-current)"
          RULES_SHA="$(git rev-parse HEAD)"

          echo "SEMGREP_RULES_BRANCH=$RULES_BRANCH" >> "$GITHUB_ENV"
          echo "SEMGREP_RULES_SHA=$RULES_SHA" >> "$GITHUB_ENV"

          {
            echo "### Semgrep advisory scan provenance"
            echo ""
            echo "- **Redshift commit:** \`$GITHUB_SHA\`"
            echo "- **Semgrep engine:** \`$(semgrep --version)\`"
            echo "- **Rules repository:** \`semgrep/semgrep-rules\`"
            echo "- **Rules branch:** \`$RULES_BRANCH\`"
            echo "- **Rules commit:** \`$RULES_SHA\`"
            echo ""
            echo "The upstream rules are intentionally fetched fresh for each scan."
            echo "Findings are advisory and do not constitute a security certification."
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "Redshift commit: $GITHUB_SHA"
            echo "Semgrep engine: $(semgrep --version)"
            echo "Rules repository: https://github.com/semgrep/semgrep-rules"
            echo "Rules branch: $RULES_BRANCH"
            echo "Rules commit: $RULES_SHA"
          } > "$GITHUB_WORKSPACE/semgrep-provenance.txt"
 
      - name: Run advisory Semgrep scan
        shell: bash
        run: |
          semgrep scan \
            --metrics=off \
            --config "$RUNNER_TEMP/semgrep-rules" \
            --json \
            --output semgrep-results.json \
            .

      - name: Print advisory findings
        shell: bash
        run: |
          semgrep scan \
            --metrics=off \
            --config "$RUNNER_TEMP/semgrep-rules" \
            .

      - name: Upload advisory results
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-advisory-${{ github.sha }}
          path: |
            semgrep-results.json
            semgrep-provenance.txt
          retention-days: 90
          if-no-files-found: error
