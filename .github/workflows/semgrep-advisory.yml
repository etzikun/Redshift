name: Semgrep Advisory Review

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - third_party/**
      - CMakeLists.txt

  pull_request:
    paths:
      - src/**
      - third_party/**
      - CMakeLists.txt

  workflow_dispatch:

  schedule:
    - cron: "17 3 * * 1"
      timezone: "America/New_York"

permissions:
  contents: read

jobs:
  semgrep-advisory:
    name: Advisory findings
    runs-on: ubuntu-latest

    steps:
      - name: Check out Redshift
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements-semgrep.txt

      - name: Load pinned rules revision
        shell: bash
        run: |
          set -euo pipefail
          source .github/semgrep-rules.env
          [[ "$SEMGREP_RULES_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "SEMGREP_RULES_SHA=$SEMGREP_RULES_SHA" >> "$GITHUB_ENV"

      - name: Install pinned Semgrep engine
        shell: bash
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --requirement .github/requirements-semgrep.txt
          echo "SEMGREP_VERSION=$(semgrep --version)" >> "$GITHUB_ENV"

      - name: Fetch pinned Semgrep rules
        shell: bash
        run: |
          set -euo pipefail
          RULES_DIR="$RUNNER_TEMP/semgrep-rules"
          git init "$RULES_DIR"
          git -C "$RULES_DIR" remote add origin \
            https://github.com/semgrep/semgrep-rules.git
          git -C "$RULES_DIR" fetch --depth 1 origin "$SEMGREP_RULES_SHA"
          git -C "$RULES_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$RULES_DIR" rev-parse HEAD)" = "$SEMGREP_RULES_SHA"

          {
            echo "### Semgrep advisory scan provenance"
            echo ""
            echo "- **Redshift commit:** \`$GITHUB_SHA\`"
            echo "- **Semgrep engine:** \`$SEMGREP_VERSION\`"
            echo "- **Rules repository:** \`semgrep/semgrep-rules\`"
            echo "- **Rules commit:** \`$SEMGREP_RULES_SHA\`"
            echo "- **Rules scope:** \`c/lang/security\`"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "Redshift commit: $GITHUB_SHA"
            echo "Semgrep engine: $SEMGREP_VERSION"
            echo "Rules repository: https://github.com/semgrep/semgrep-rules"
            echo "Rules commit: $SEMGREP_RULES_SHA"
            echo "Rules scope: c/lang/security"
          } > "$GITHUB_WORKSPACE/semgrep-provenance.txt"

      - name: Run advisory Semgrep scan
        shell: bash
        run: |
          set -o pipefail
          semgrep scan \
            --metrics=off \
            --config "$RUNNER_TEMP/semgrep-rules/c/lang/security" \
            --json \
            --output semgrep-results.json \
            . 2>&1 | tee semgrep-scan.log

      - name: Print advisory findings
        if: success()
        shell: bash
        run: |
          semgrep scan \
            --metrics=off \
            --config "$RUNNER_TEMP/semgrep-rules/c/lang/security" \
            .

      - name: Upload advisory results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: semgrep-advisory-${{ github.sha }}
          path: |
            semgrep-results.json
            semgrep-provenance.txt
            semgrep-scan.log
          retention-days: 90
          if-no-files-found: warn
